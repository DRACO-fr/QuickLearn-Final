<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Desk — Notes, AI Flashcards & Spaced Repetition</title>
<meta name="description" content="Notes, AI flashcards and spaced-repetition study sessions.">
<meta name="theme-color" content="#7C5CFC" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Study Desk" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --radius:1rem;
  --background:oklch(0.16 0.012 288);
  --foreground:oklch(0.96 0.004 285);
  --surface:oklch(0.21 0.014 288);
  --surface-2:oklch(0.25 0.016 288);
  --primary:oklch(0.63 0.19 288);
  --primary-fg:oklch(0.99 0 0);
  --muted-fg:oklch(0.68 0.014 286);
  --accent:oklch(0.3 0.03 288);
  --destructive:oklch(0.66 0.19 15);
  --success:oklch(0.72 0.17 150);
  --warning:oklch(0.79 0.15 78);
  --info:oklch(0.68 0.16 250);
  --border:oklch(0.3 0.016 288);
  --font-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;border-color:var(--border)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;margin:0}
button,input,textarea{font-family:inherit}
.shell{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:7rem}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;background:color-mix(in oklab,var(--background) 85%,transparent);backdrop-filter:blur(12px)}
.brand{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.keybtn{border:1px solid var(--border);background:transparent;color:var(--muted-fg);border-radius:999px;padding:.4rem .9rem;font-size:.75rem;font-weight:600;cursor:pointer}
.keybtn:hover{color:var(--foreground)}
main{padding:0 1.25rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:1rem}
.hero{border-radius:calc(var(--radius) + 8px);padding:1.5rem;background-image:linear-gradient(140deg,oklch(0.4 0.14 292) 0%,oklch(0.28 0.08 290) 55%,oklch(0.22 0.02 288) 100%);margin-top:.5rem}
.hero h1{font-size:1.6rem;font-weight:800}
.hero p{color:oklch(0.85 0.02 290);font-size:.9rem;margin:.4rem 0 0}
.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:0 1rem;font-size:.875rem;font-weight:600;border:none;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-fg);box-shadow:0 12px 32px -14px oklch(0.62 0.21 288 / .85)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--surface-2);color:var(--foreground);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--muted-fg)}
.btn-ghost:hover{color:var(--foreground)}
.btn-success{background:var(--success);color:var(--background)}
.btn-warning{background:var(--warning);color:var(--background)}
.btn-danger{background:var(--destructive);color:var(--primary-fg)}
.input{min-height:44px;width:100%;border-radius:.75rem;border:1px solid var(--border);background:var(--surface-2);padding:0 .875rem;font-size:.875rem;color:var(--foreground);outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 30%,transparent)}
.input::placeholder,textarea::placeholder{color:var(--muted-fg)}
textarea.input{min-height:9rem;padding:.875rem;resize:vertical;line-height:1.6;border-radius:1rem}
.label{margin:1.5rem 0 .75rem;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg)}
.empty{border:1px dashed var(--border);border-radius:1rem;background:color-mix(in oklab,var(--surface) 50%,transparent);padding:1.5rem;text-align:center;font-size:.875rem;color:var(--muted-fg)}
.row{display:flex;gap:.5rem;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.muted{color:var(--muted-fg);font-size:.85rem}
.deck-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;cursor:pointer;color:var(--foreground);margin-bottom:.6rem}
.deck-card:hover{border-color:var(--primary)}
.deck-title{font-weight:700;font-size:.95rem}
.chip{display:inline-block;font-size:.7rem;font-weight:600;border-radius:999px;padding:.15rem .6rem;margin-top:.4rem}
.tone0{color:var(--info);background:oklch(0.68 0.16 250 / .16)}
.tone1{color:var(--warning);background:oklch(0.79 0.15 78 / .16)}
.tone2{color:var(--success);background:oklch(0.72 0.17 150 / .16)}
.tone3{color:var(--primary);background:oklch(0.63 0.19 288 / .18)}
.tone4{color:var(--destructive);background:oklch(0.66 0.19 15 / .16)}
.progress{height:.5rem;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:.8rem}
.progress>div{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--border);background:color-mix(in oklab,var(--surface) 95%,transparent);backdrop-filter:blur(12px);padding:.5rem .5rem max(.5rem,env(safe-area-inset-bottom))}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;background:none;border:none;color:var(--muted-fg);cursor:pointer;padding:.2rem 0;font-size:.625rem;font-weight:700}
.navitem.active{color:var(--primary)}
.navitem .ico{display:flex;height:2rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.75rem}
.navitem.active .ico{background:color-mix(in oklab,var(--primary) 15%,transparent)}
.plusbtn{margin-top:-1.5rem;width:3.25rem;height:3.25rem;border-radius:1rem;background:var(--primary);color:var(--primary-fg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 32px -14px oklch(0.62 0.21 288 / .85)}
.plusbtn:active{transform:scale(.95)}
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);padding:1rem}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:28rem;background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;padding:1.25rem}
.flashcard{position:relative;width:100%;min-height:16rem;border-radius:1.5rem;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;transition:.2s;user-select:none}
.flashcard:hover{border-color:var(--primary)}
.flashcard .q{font-size:1.15rem;font-weight:600;line-height:1.5}
.flashcard .hint{position:absolute;bottom:1rem;left:0;right:0;font-size:.7rem;color:var(--muted-fg)}
.flashcard .tag{position:absolute;top:1rem;left:1rem;font-size:.7rem;color:var(--muted-fg)}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.note{background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.6rem;font-size:.875rem;line-height:1.6;white-space:pre-wrap}
.backbtn{background:none;border:none;color:var(--muted-fg);cursor:pointer;font-size:.85rem;font-weight:600;padding:.5rem 0;display:inline-flex;align-items:center;gap:.3rem}
.backbtn:hover{color:var(--foreground)}
.spin{display:inline-block;width:1rem;height:1rem;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.15em}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--foreground);border-radius:.75rem;padding:.6rem 1rem;font-size:.85rem;z-index:60;max-width:90%}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:.75rem;padding:.8rem 1rem;margin-bottom:.5rem;color:var(--foreground);cursor:pointer;font-size:.9rem}
.quiz-opt.correct{border-color:var(--success);background:color-mix(in oklab,var(--success) 15%,transparent)}
.quiz-opt.wrong{border-color:var(--destructive);background:color-mix(in oklab,var(--destructive) 15%,transparent)}
a.linkcard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.6rem;color:var(--foreground);text-decoration:none}
a.linkcard:hover{border-color:var(--primary)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand" onclick="go('#/')">Study Desk</div>
    <button class="keybtn" onclick="openKeyModal()">AI key</button>
  </header>
  <main id="view"></main>
  <nav class="bottom">
    <button class="navitem" data-nav="#/" onclick="go('#/')"><span class="ico">🏠</span>Home</button>
    <button class="navitem" data-nav="#/search" onclick="go('#/search')"><span class="ico">🔍</span>Search</button>
    <button class="plusbtn" aria-label="Create a deck" onclick="go('#/',true)">＋</button>
    <button class="navitem" data-nav="#/library" onclick="go('#/library')"><span class="ico">📚</span>Library</button>
    <button class="navitem" data-nav="#/study" onclick="go('#/study')"><span class="ico">🎯</span>Study</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="imgInput" accept="image/*" style="display:none">

<script>
/* ============================== DATA ============================== */
const DATA_KEY = "studydesk-data-v1";
const KEY_KEY = "studydesk-gemini-key";
const EMPTY = { decks: [], subjects: [], notes: [], cards: [] };
let data = load();

function load(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(!raw) return structuredClone(EMPTY);
    const d = JSON.parse(raw);
    return { decks:d.decks||[], subjects:d.subjects||[], notes:d.notes||[], cards:d.cards||[] };
  }catch{ return structuredClone(EMPTY); }
}
function save(){ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const deckCards = id => data.cards.filter(c => c.deckId === id);
const deckNotes = id => data.notes.filter(n => n.deckId === id);
const dueCards = id => data.cards.filter(c => c.nextReview <= todayISO() && (id ? c.deckId === id : true));
const subjectName = d => d.subjectId ? (data.subjects.find(s=>s.id===d.subjectId)?.name || d.subject) : d.subject;
const tone = i => "tone" + (i % 5);

function createDeck(title, subjectId){
  if(!title.trim()) return null;
  const subj = data.subjects.find(s=>s.id===subjectId);
  const deck = { id:uid(), title:title.trim(), subject: subj?subj.name:"General", subjectId: subjectId||null, createdAt: todayISO() };
  data.decks.unshift(deck); save(); return deck;
}
function deleteDeck(id){
  data.decks = data.decks.filter(d=>d.id!==id);
  data.notes = data.notes.filter(n=>n.deckId!==id);
  data.cards = data.cards.filter(c=>c.deckId!==id);
  save();
}
function createSubject(name){
  if(!name.trim()) return;
  data.subjects.push({ id:uid(), name:name.trim(), createdAt: todayISO() }); save();
}
function deleteSubject(id){
  data.subjects = data.subjects.filter(s=>s.id!==id);
  data.decks = data.decks.map(d => d.subjectId===id ? {...d, subjectId:null} : d);
  save();
}
function addCards(deckId, cards){
  const made = cards.filter(c=>c.question?.trim() && c.answer?.trim()).map(c=>({
    id:uid(), deckId, question:c.question.trim(), answer:c.answer.trim(),
    interval:1, ease:2.3, repetitions:0, nextReview: todayISO()
  }));
  if(made.length){ data.cards = [...made, ...data.cards]; save(); }
  return made.length;
}
function rateCard(cardId, rating){
  data.cards = data.cards.map(c=>{
    if(c.id!==cardId) return c;
    let {interval, ease, repetitions} = c;
    if(rating==="again"){ repetitions=0; interval=1; ease=Math.max(1.3, ease-0.2); }
    else{
      repetitions++;
      if(rating==="hard"){ interval=Math.max(1, Math.round(interval*1.2)); ease=Math.max(1.3, ease-0.05); }
      else if(rating==="good"){ interval=Math.round(interval*ease); }
      else { interval=Math.round(interval*ease*1.3); ease=ease+0.1; }
    }
    return {...c, interval, ease, repetitions, nextReview: addDays(todayISO(), interval)};
  });
  save();
}

/* ============================== GEMINI ============================== */
const getKey = () => localStorage.getItem(KEY_KEY) || "";
async function gemini(prompt, imageBase64){
  const key = getKey();
  if(!key) throw new Error("Add your Gemini API key first (AI key button, top right). Get a free one at aistudio.google.com/apikey");
  const parts = [{text:prompt}];
  if(imageBase64) parts.push({ inline_data:{ mime_type:"image/jpeg", data:imageBase64 } });
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key="+encodeURIComponent(key), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ contents:[{ parts }] })
  });
  if(!res.ok){
    const t = await res.text();
    if(res.status===400||res.status===403) throw new Error("API key rejected — check it in the AI key dialog.");
    throw new Error("Gemini error " + res.status + ": " + t.slice(0,120));
  }
  const j = await res.json();
  return j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "";
}

/* ============================== UI HELPERS ============================== */
const view = document.getElementById("view");
function go(hash, openCreate){ location.hash = hash; if(openCreate) setTimeout(openCreateDeck, 50); }
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.getElementById("toast-root").appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function modal(html){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
function openKeyModal(){
  modal(`<h2 style="font-size:1rem">Gemini API key</h2>
    <p class="muted" style="margin:.4rem 0 1rem">Needed only for the AI features. Get a free key at aistudio.google.com/apikey. Stored on this device only.</p>
    <input class="input" id="keyField" placeholder="AIza…" value="${esc(getKey())}">
    <div class="row" style="justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="localStorage.setItem('${KEY_KEY}',document.getElementById('keyField').value.trim());closeModal();toast('Key saved')">Save</button>
    </div>`);
}

/* ============================== FLASHCARD SESSION ============================== */
/* Shared session used by BOTH deck study and "Study all" — fixes the bug where
   cards wouldn't advance/flip in the Study tab. State lives in one object and
   every interaction re-renders from it. */
let session = null; // {cards, idx, flipped, back, title}

function startSession(cards, title, back){
  if(!cards.length) return;
  session = { cards:[...cards].sort(()=>Math.random()-.5), idx:0, flipped:false, back, title };
  renderSession();
}
function renderSession(){
  const s = session;
  if(!s) return;
  if(s.idx >= s.cards.length){
    view.innerHTML = `
      <button class="backbtn" onclick="go('${s.back}')">← Back</button>
      <div class="panel" style="text-align:center;padding:2.5rem 1rem;margin-top:1rem">
        <div style="font-size:2.5rem">🎉</div>
        <h1 style="font-size:1.4rem;margin-top:.5rem">Session complete</h1>
        <p class="muted" style="margin-top:.5rem">You reviewed ${s.cards.length} card${s.cards.length===1?"":"s"}. Nice work.</p>
        <button class="btn btn-primary" style="margin-top:1.25rem" onclick="go('${s.back}')">Done</button>
      </div>`;
    return;
  }
  const card = s.cards[s.idx];
  const deck = data.decks.find(d=>d.id===card.deckId);
  const pct = Math.round((s.idx / s.cards.length) * 100);
  view.innerHTML = `
    <button class="backbtn" onclick="session=null;go('${s.back}')">← End session</button>
    <div class="row" style="justify-content:space-between;margin-top:.5rem">
      <h1 style="font-size:1.1rem">${esc(s.title)}</h1>
      <span class="muted">Card ${s.idx+1} of ${s.cards.length}</span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="flashcard" style="margin-top:1.25rem" onclick="session.flipped=!session.flipped;renderSession()">
      ${deck ? `<span class="tag">${esc(deck.title)}</span>` : ""}
      <div class="q">${esc(s.flipped ? card.answer : card.question)}</div>
      <span class="hint">${s.flipped ? "Rate how well you knew it" : "Tap to reveal the answer"}</span>
    </div>
    ${s.flipped ? `
    <div class="ratings">
      <button class="btn btn-danger" onclick="rate('again')">Again</button>
      <button class="btn btn-warning" onclick="rate('hard')">Hard</button>
      <button class="btn btn-success" onclick="rate('good')">Good</button>
      <button class="btn btn-primary" onclick="rate('easy')">Easy</button>
    </div>` : ""}`;
}
function rate(r){
  const card = session.cards[session.idx];
  rateCard(card.id, r);
  session.idx++;
  session.flipped = false;
  renderSession();
}

/* ============================== VIEWS ============================== */
function renderHome(){
  const due = dueCards();
  const reviewed = data.cards.filter(c=>c.repetitions>0).length;
  const pct = data.cards.length ? Math.round(reviewed/data.cards.length*100) : 0;
  view.innerHTML = `
    <div class="hero">
      <h1>Your desk, your pace.</h1>
      <p>${data.cards.length ? `${pct}% of ${data.cards.length} cards reviewed · ${due.length} due today` : "Create a deck, add notes, and let AI build your flashcards."}</p>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>
    <h2 class="label">Create a deck</h2>
    <div class="panel">
      <input class="input" id="deckTitle" placeholder="e.g. Biology — Chapter 4">
      <div class="row" style="margin-top:.75rem">
        <select class="input" id="deckSubject" style="flex:1">
          <option value="">No folder</option>
          ${data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}
        </select>
        <button class="btn btn-primary" onclick="createDeckFromHome()">Create</button>
      </div>
    </div>
    <h2 class="label">Recent decks</h2>
    ${data.decks.length ? data.decks.slice(0,6).map((d,i)=>`
      <button class="deck-card" onclick="go('#/deck/${d.id}')">
        <div class="deck-title">${esc(d.title)}</div>
        <span class="chip ${tone(i)}">${esc(subjectName(d))}</span>
        <span class="muted" style="float:right;font-size:.75rem">${deckCards(d.id).length} cards</span>
      </button>`).join("") : `<div class="empty">No decks yet — create your first one above.</div>`}
    ${due.length ? `<button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="startSession(dueCards(),'Study all due cards','#/study')">Study ${due.length} due card${due.length===1?"":"s"}</button>` : ""}`;
  if(location.hash.includes("create")) setTimeout(()=>document.getElementById("deckTitle")?.focus(),50);
}
function createDeckFromHome(){
  const t = document.getElementById("deckTitle").value;
  const s = document.getElementById("deckSubject").value;
  const d = createDeck(t, s||null);
  if(!d){ toast("Give the deck a title first"); return; }
  go("#/deck/"+d.id);
}

function renderSearch(){
  view.innerHTML = `
    <h1 style="font-size:1.4rem;margin-top:1rem">Search</h1>
    <input class="input" id="q" placeholder="Search your notes and cards…" style="margin-top:1rem" oninput="renderSearchResults(this.value)">
    <div id="results" style="margin-top:1rem"></div>
    <h2 class="label">Free study resources</h2>
    <a class="linkcard" href="https://www.khanacademy.org" target="_blank" rel="noopener">🎓 Khan Academy — free courses</a>
    <a class="linkcard" href="https://www.coursera.org/courses?query=free" target="_blank" rel="noopener">📖 Coursera — free courses</a>
    <a class="linkcard" href="https://www.google.com/search?q=free+practice+tests" target="_blank" rel="noopener">📝 Search the web for practice tests</a>`;
}
function renderSearchResults(q){
  const el = document.getElementById("results");
  if(!q.trim()){ el.innerHTML = ""; return; }
  const needle = q.toLowerCase();
  const cn = data.notes.filter(n=>n.content.toLowerCase().includes(needle));
  const cc = data.cards.filter(c=>c.question.toLowerCase().includes(needle)||c.answer.toLowerCase().includes(needle));
  el.innerHTML = (cn.length+cc.length) ? `
    ${cn.map(n=>{const d=data.decks.find(x=>x.id===n.deckId);return `<button class="deck-card" onclick="go('#/deck/${n.deckId}')"><div class="muted" style="font-size:.7rem">Note · ${esc(d?.title||"")}</div><div style="font-size:.85rem;margin-top:.3rem">${esc(n.content.slice(0,140))}${n.content.length>140?"…":""}</div></button>`}).join("")}
    ${cc.map(c=>{const d=data.decks.find(x=>x.id===c.deckId);return `<button class="deck-card" onclick="go('#/deck/${c.deckId}')"><div class="muted" style="font-size:.7rem">Card · ${esc(d?.title||"")}</div><div style="font-size:.85rem;margin-top:.3rem">${esc(c.question)}</div></button>`}).join("")}`
    : `<div class="empty">Nothing found for “${esc(q)}”.</div>`;
}

function renderLibrary(){
  view.innerHTML = `
    <h1 style="font-size:1.4rem;margin-top:1rem">Library</h1>
    <h2 class="label">Folders</h2>
    <div class="row">
      <input class="input" id="subjName" placeholder="New folder name…" style="flex:1">
      <button class="btn btn-secondary" onclick="createSubject(document.getElementById('subjName').value);route()">Add</button>
    </div>
    <div class="grid2" style="margin-top:.75rem">
      ${data.subjects.map((s,i)=>{
        const count = data.decks.filter(d=>d.subjectId===s.id).length;
        return `<button class="deck-card" style="margin:0" onclick="go('#/folder/${s.id}')">
          <div style="font-size:1.4rem">📁</div>
          <div class="deck-title" style="margin-top:.4rem">${esc(s.name)}</div>
          <div class="muted" style="font-size:.75rem;margin-top:.2rem">${count} deck${count===1?"":"s"}</div>
        </button>`}).join("")}
    </div>
    ${data.subjects.length?"":`<div class="empty" style="margin-top:.75rem">No folders yet.</div>`}
    <h2 class="label">All decks</h2>
    ${data.decks.length ? data.decks.map((d,i)=>`
      <button class="deck-card" onclick="go('#/deck/${d.id}')">
        <div class="deck-title">${esc(d.title)}</div>
        <span class="chip ${tone(i)}">${esc(subjectName(d))}</span>
        <span class="muted" style="float:right;font-size:.75rem">${deckCards(d.id).length} cards</span>
      </button>`).join("") : `<div class="empty">No decks yet.</div>`}`;
}

function renderFolder(id){
  const s = data.subjects.find(x=>x.id===id);
  if(!s){ go("#/library"); return; }
  const decks = data.decks.filter(d=>d.subjectId===id);
  view.innerHTML = `
    <button class="backbtn" onclick="go('#/library')">← Library</button>
    <div class="row" style="justify-content:space-between;margin-top:.5rem">
      <h1 style="font-size:1.4rem">📁 ${esc(s.name)}</h1>
      <button class="btn btn-ghost" onclick="if(confirm('Delete this folder? Decks stay, they just become unfiled.')){deleteSubject('${id}');go('#/library')}">Delete</button>
    </div>
    <h2 class="label">Decks</h2>
    ${decks.length ? decks.map(d=>`
      <button class="deck-card" onclick="go('#/deck/${d.id}')">
        <div class="deck-title">${esc(d.title)}</div>
        <span class="muted" style="font-size:.75rem">${deckCards(d.id).length} cards</span>
      </button>`).join("") : `<div class="empty">No decks in this folder yet.</div>`}`;
}

function renderStudy(){
  const due = dueCards();
  const byDeck = data.decks.map(d=>({deck:d, due:dueCards(d.id).length})).filter(x=>x.due>0);
  view.innerHTML = `
    <h1 style="font-size:1.4rem;margin-top:1rem">Study</h1>
    <div class="panel" style="margin-top:1rem;text-align:center">
      <div style="font-size:2rem;font-weight:800;font-family:var(--font-display)">${due.length}</div>
      <div class="muted">card${due.length===1?"":"s"} due today</div>
      ${due.length ? `<button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="startSession(dueCards(),'Study all due cards','#/study')">Study all due cards</button>` : `<p class="muted" style="margin-top:.75rem">All caught up — come back tomorrow. 🎉</p>`}
    </div>
    <h2 class="label">By deck</h2>
    ${byDeck.length ? byDeck.map(x=>`
      <button class="deck-card" onclick="startSession(dueCards('${x.deck.id}'),'${esc(x.deck.title)}','#/study')">
        <div class="deck-title">${esc(x.deck.title)}</div>
        <span class="muted" style="font-size:.75rem">${x.due} due</span>
      </button>`).join("") : `<div class="empty">No cards due in any deck.</div>`}`;
}

/* ============================== DECK PAGE ============================== */
let quizState = null;
function renderDeck(id){
  const d = data.decks.find(x=>x.id===id);
  if(!d){ go("#/"); return; }
  const notes = deckNotes(id);
  const cards = deckCards(id);
  const due = dueCards(id);
  view.innerHTML = `
    <button class="backbtn" onclick="history.back()">← Back</button>
    <div class="row" style="justify-content:space-between;margin-top:.5rem">
      <h1 style="font-size:1.3rem;flex:1">${esc(d.title)}</h1>
      <button class="btn btn-ghost" onclick="if(confirm('Delete this deck and all its notes and cards?')){deleteDeck('${id}');go('#/')}">Delete</button>
    </div>
    <span class="chip tone3">${esc(subjectName(d))}</span>
    <span class="muted" style="font-size:.8rem;margin-left:.5rem">${cards.length} cards · ${due.length} due</span>

    <div class="grid2" style="margin-top:1rem">
      <button class="btn btn-primary" ${due.length?"":"disabled"} onclick="startSession(dueCards('${id}'),'${esc(d.title)}','#/deck/${id}')">Study cards (${due.length})</button>
      <button class="btn btn-secondary" ${cards.length>=4?"":"disabled"} onclick="startQuiz('${id}')">Quiz me</button>
    </div>

    <h2 class="label">Notes</h2>
    <textarea class="input" id="noteText" placeholder="Paste or type your notes here…"></textarea>
    <div class="row" style="margin-top:.5rem;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveNote('${id}')">Save note</button>
      <button class="btn btn-secondary" onclick="aiAct('${id}','improve')">✨ Improve</button>
      <button class="btn btn-secondary" onclick="aiAct('${id}','summarize')">✨ Summarize</button>
    </div>
    <div class="row" style="margin-top:.5rem;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="document.getElementById('imgInput').click()">📷 Scan photo of notes</button>
      <button class="btn btn-secondary" ${notes.length?"":"disabled"} onclick="aiAct('${id}','cards')">✨ Make flashcards from notes</button>
    </div>
    <div id="aiOut"></div>
    <div style="margin-top:1rem">
      ${notes.map(n=>`
        <div class="note">
          ${esc(n.content)}
          <div class="row" style="justify-content:flex-end;margin-top:.5rem">
            <button class="btn btn-ghost" style="min-height:2rem;padding:0 .5rem;font-size:.75rem" onclick="editNote('${n.id}')">Edit</button>
            <button class="btn btn-ghost" style="min-height:2rem;padding:0 .5rem;font-size:.75rem" onclick="data.notes=data.notes.filter(x=>x.id!=='${n.id}');save();route()">Delete</button>
          </div>
        </div>`).join("")}
    </div>

    <h2 class="label">Flashcards</h2>
    <div class="panel">
      <input class="input" id="cardQ" placeholder="Question">
      <input class="input" id="cardA" placeholder="Answer" style="margin-top:.5rem">
      <button class="btn btn-primary" style="width:100%;margin-top:.75rem" onclick="addManualCard('${id}')">Add card</button>
    </div>
    <div style="margin-top:.75rem">
      ${cards.map(c=>`
        <div class="deck-card" style="cursor:default">
          <div style="font-weight:600;font-size:.9rem">${esc(c.question)}</div>
          <div class="muted" style="margin-top:.3rem">${esc(c.answer)}</div>
          <div class="row" style="justify-content:space-between;margin-top:.5rem">
            <span class="muted" style="font-size:.7rem">Next review: ${c.nextReview}</span>
            <button class="btn btn-ghost" style="min-height:2rem;padding:0 .5rem;font-size:.75rem" onclick="data.cards=data.cards.filter(x=>x.id!=='${c.id}');save();route()">Delete</button>
          </div>
        </div>`).join("") || `<div class="empty">No cards yet — add some or generate them from notes.</div>`}
    </div>`;
  document.getElementById("imgInput").onchange = e => scanImage(id, e.target.files[0]);
}
function saveNote(id){
  const el = document.getElementById("noteText");
  if(!el.value.trim()){ toast("Write something first"); return; }
  data.notes.unshift({ id:uid(), deckId:id, content:el.value.trim(), createdAt: todayISO() });
  save(); route(); toast("Note saved");
}
function editNote(id){
  const n = data.notes.find(x=>x.id===id);
  modal(`<h2 style="font-size:1rem">Edit note</h2>
    <textarea class="input" id="editNoteField" style="margin-top:.75rem">${esc(n.content)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="n.content=document.getElementById('editNoteField').value;window._saveNote()">Save</button>
    </div>`);
  window._saveNote = () => { n.content = document.getElementById("editNoteField").value; save(); closeModal(); route(); };
}
function addManualCard(id){
  const q = document.getElementById("cardQ").value, a = document.getElementById("cardA").value;
  if(!addCards(id,[{question:q,answer:a}])){ toast("Fill in both question and answer"); return; }
  route(); toast("Card added");
}
async function aiAct(id, kind){
  const out = document.getElementById("aiOut");
  out.innerHTML = `<div class="panel" style="margin-top:.75rem"><span class="spin"></span> Working…</div>`;
  const notes = deckNotes(id).map(n=>n.content).join("\n\n");
  try{
    if(kind==="improve" || kind==="summarize"){
      const src = notes || document.getElementById("noteText").value;
      if(!src.trim()) throw new Error("Add some notes first.");
      const prompt = kind==="improve"
        ? "Improve and expand these study notes. Make them clear, structured, and complete for a student. Return only the improved notes.\n\n"+src
        : "Summarize these study notes into concise bullet points. Return only the summary.\n\n"+src;
      const text = await gemini(prompt);
      data.notes.unshift({ id:uid(), deckId:id, content:text.trim(), createdAt: todayISO() });
      save(); route(); toast(kind==="improve"?"Improved note saved":"Summary saved");
    } else if(kind==="cards"){
      const text = await gemini(
        "Create flashcards from these study notes. Return ONLY a JSON array of objects with \"question\" and \"answer\" strings, no markdown fences. 8-15 cards.\n\n"+notes);
      const clean = text.replace(/```json|```/g,"").trim();
      const arr = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]")+1));
      const n = addCards(id, arr);
      route(); toast(`${n} flashcards added`);
    }
  }catch(e){
    out.innerHTML = `<div class="panel" style="margin-top:.75rem;color:var(--destructive);font-size:.85rem">${esc(e.message)}</div>`;
  }
}
async function scanImage(deckId, file){
  if(!file) return;
  const out = document.getElementById("aiOut");
  out.innerHTML = `<div class="panel" style="margin-top:.75rem"><span class="spin"></span> Reading your photo…</div>`;
  try{
    const b64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const text = await gemini("Transcribe the study notes in this image into clean, structured text. Return only the notes.", b64);
    if(text.trim()){
      data.notes.unshift({ id:uid(), deckId, content:text.trim(), createdAt: todayISO() });
      save(); route(); toast("Scanned note saved");
    }
  }catch(e){
    out.innerHTML = `<div class="panel" style="margin-top:.75rem;color:var(--destructive);font-size:.85rem">${esc(e.message)}</div>`;
  }
  document.getElementById("imgInput").value = "";
}

/* ============================== QUIZ ============================== */
function startQuiz(deckId){
  const cards = [...deckCards(deckId)].sort(()=>Math.random()-.5).slice(0,8);
  const others = data.cards.filter(c=>c.deckId!==deckId);
  const questions = cards.map(c=>{
    const pool = [...others, ...deckCards(deckId).filter(x=>x.id!==c.id)];
    const wrong = [...new Set(pool.map(x=>x.answer))].filter(a=>a!==c.answer).sort(()=>Math.random()-.5).slice(0,3);
    return { q:c.question, correct:c.answer, options:[...wrong, c.answer].sort(()=>Math.random()-.5) };
  });
  quizState = { questions, idx:0, score:0, deckId };
  renderQuiz();
}
function renderQuiz(){
  const s = quizState;
  if(s.idx >= s.questions.length){
    view.innerHTML = `
      <div class="panel" style="text-align:center;padding:2.5rem 1rem;margin-top:2rem">
        <div style="font-size:2.5rem">🧠</div>
        <h1 style="font-size:1.4rem;margin-top:.5rem">Quiz done</h1>
        <p class="muted" style="margin-top:.5rem">You scored ${s.score} / ${s.questions.length}</p>
        <button class="btn btn-primary" style="margin-top:1.25rem" onclick="go('#/deck/${s.deckId}')">Back to deck</button>
      </div>`;
    return;
  }
  const q = s.questions[s.idx];
  view.innerHTML = `
    <button class="backbtn" onclick="go('#/deck/${s.deckId}')">← End quiz</button>
    <div class="row" style="justify-content:space-between;margin-top:.5rem">
      <h1 style="font-size:1.1rem">Quiz</h1>
      <span class="muted">${s.idx+1} / ${s.questions.length}</span>
    </div>
    <div class="panel" style="margin-top:1rem">
      <div style="font-weight:600;font-size:1.05rem;line-height:1.5">${esc(q.q)}</div>
    </div>
    <div style="margin-top:1rem" id="quizOpts">
      ${q.options.map(o=>`<button class="quiz-opt" onclick="answerQuiz(this,'${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join("")}
    </div>`;
}
function answerQuiz(btn, picked){
  const s = quizState, q = s.questions[s.idx];
  const opts = document.querySelectorAll(".quiz-opt");
  opts.forEach(b=>b.disabled = true);
  const correct = picked === q.correct;
  btn.classList.add(correct ? "correct" : "wrong");
  if(!correct) opts.forEach(b=>{ if(b.textContent === q.correct) b.classList.add("correct"); });
  if(correct) s.score++;
  setTimeout(()=>{ s.idx++; renderQuiz(); }, 900);
}

/* ============================== ROUTER ============================== */
function route(){
  session = null;
  const h = location.hash || "#/";
  document.querySelectorAll(".navitem").forEach(n=>{
    n.classList.toggle("active", n.dataset.nav === "#/" ? (h==="#/"||h===""||h==="#/create") : h.startsWith(n.dataset.nav));
  });
  if(h.startsWith("#/deck/")) renderDeck(h.slice(7));
  else if(h.startsWith("#/folder/")) renderFolder(h.slice(9));
  else if(h.startsWith("#/search")) renderSearch();
  else if(h.startsWith("#/library")) renderLibrary();
  else if(h.startsWith("#/study")) renderStudy();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
