<style>
  :root {
    --bg: #0B0B0E;
    --surface: #17171C;
    --surface2: #1F1F26;
    --ink: #F2F2F5;
    --ink-soft: #9797A3;
    --line: #2A2A32;
    --purple: #7C5CFC;
    --purple-dark: #6544E0;
    --blue: #3B82F6;
    --orange: #F5821F;
    --tan: #F0B057;
    --green: #22C55E;
    --pink: #EC4899;
    --red: #FF5C7A;
    --amber: #FFB020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  #app { max-width: 720px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 78px; }
  .header {
    padding: 20px 22px 8px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .brand { font-family: "Poppins", sans-serif; font-size: 24px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
  .back { font-size: 13px; font-weight: 600; color: var(--purple); cursor: pointer; }
  .content { padding: 16px 22px 24px; }
  input, textarea {
    font-family: inherit; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
    font-size: 14px; background: var(--surface); color: var(--ink); width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--ink-soft); }
  input:focus, textarea:focus { outline: none; border-color: var(--purple); }
  textarea { min-height: 110px; resize: vertical; }
  button {
    font-family: "Poppins", sans-serif; font-weight: 600; font-size: 14px; padding: 11px 20px;
    border-radius: 999px; border: none; cursor: pointer; transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn-primary { background: var(--purple); color: #fff; box-shadow: 0 4px 14px rgba(124,92,252,0.35); }
  .btn-secondary { background: var(--surface2); color: var(--ink); }
  .btn-gold { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; box-shadow: 0 4px 14px rgba(236,72,153,0.25); }
  .btn-ghost { background: transparent; color: var(--red); padding: 4px 8px; font-size: 12px; border-radius: 8px; }
  .btn-link { background: transparent; color: var(--purple); padding: 4px 8px; font-size: 12px; text-decoration: none; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-bar {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px;
    padding: 13px 18px; margin-bottom: 18px; color: var(--ink-soft); font-size: 14px;
  }
  .search-bar input { background: transparent; border: none; padding: 0; color: var(--ink); }
  .search-bar input:focus { outline: none; }
  .section-label { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); margin: 18px 0 10px; }
  .deck-row {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    background: var(--surface); border: none; border-radius: 18px; cursor: pointer; margin-bottom: 10px;
  }
  .deck-row:active { background: var(--surface2); }
  .folder-icon {
    width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .deck-title { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 15px; color: var(--ink); }
  .deck-meta { font-size: 12px; color: var(--ink-soft); margin-top: 3px; font-weight: 500; }
  .note-card, .card-row {
    background: var(--surface); border: none; border-radius: 18px; padding: 16px; margin-bottom: 12px;

  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 30px 0; font-weight: 500; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flash-card {
    background: var(--surface); border: none; border-radius: 22px; padding: 44px 24px;
    min-height: 120px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; margin-bottom: 18px; text-align: center; cursor: pointer;
  }
  .quiz-option {
    padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
    cursor: pointer; font-size: 14px; margin-bottom: 8px; font-weight: 500;
  }
  .center { text-align: center; }
  .small { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .settings-link { font-size: 12px; color: var(--purple); cursor: pointer; font-weight: 700; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal { background: var(--surface); border-radius: 22px; padding: 22px; max-width: 380px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .ai-note-preview { background: var(--surface2); border-radius: 14px; padding: 14px; font-size: 13px; white-space: pre-wrap; line-height: 1.5; max-height: 260px; overflow-y: auto; margin: 12px 0; color: var(--ink); }

  /* Deck-detail tabs (top, within a deck) */
  .tabs { display: flex; gap: 6px; padding: 4px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 69px; background: var(--bg); z-index: 4; }

    width: 100%; max-width: 720px; background: var(--surface); border-top: 1px solid var(--line);

<body>
<div id="app"></div>

<script>
// ---------- storage ----------
const DATA_KEY = "studydesk-data-v1";
const KEY_KEY = "studydesk-api-key";
function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(DATA_KEY)) || {};
    return { decks: d.decks || [], notes: d.notes || [], cards: d.cards || [], subjects: d.subjects || [] };
  }
  catch { return { decks: [], notes: [], cards: [], subjects: [] }; }
}
function saveData(data) { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function getApiKey() { return localStorage.getItem(KEY_KEY) || ""; }
function setApiKey(k) { localStorage.setItem(KEY_KEY, k); }

const FOLDER_COLORS = [
  { bg: "rgba(59,130,246,0.18)", fg: "var(--blue)" },
  { bg: "rgba(240,176,87,0.18)", fg: "var(--tan)" },
  { bg: "rgba(245,130,31,0.18)", fg: "var(--orange)" },
  { bg: "rgba(34,197,94,0.18)", fg: "var(--green)" },
  { bg: "rgba(124,92,252,0.18)", fg: "var(--purple)" },
  { bg: "rgba(236,72,153,0.18)", fg: "var(--pink)" }
];
function folderColor(index) { return FOLDER_COLORS[index % FOLDER_COLORS.length]; }

let state = loadData();
let view = { screen: "decks", topTab: "home", activeDeckId: null, activeSubjectId: undefined, tab: "notes", generating: false, genError: "", studySession: null, quiz: null, showKeyModal: false, noteAiLoading: null, noteAiError: "", noteAiPreview: null, searchQuery: "", scanning: false, scanError: "", draftText: "" };

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
function addDays(d, n) { const dt = new Date(d); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); }

function persist() { saveData(state); }
function onDraftInput(v) { view.draftText = v; }

// ---------- AI ----------
const GEMINI_MODEL = "gemini-3.6-flash";
async function askGemini(prompt) {
  const key = getApiKey();
  if (!key) throw new Error("no-key");
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "api-error");
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("\n").trim();
  if (!text) throw new Error("empty-response");
  return text.replace(/```json|```/g, "").trim();
}

async function askGeminiVision(prompt, base64Data, mimeType) {
  const key = getApiKey();
  if (!key) throw new Error("no-key");
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      contents: [{ parts: [
        { inline_data: { mime_type: mimeType, data: base64Data } },
        { text: prompt }
      ] }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "api-error");
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("\n").trim();
  if (!text) throw new Error("empty-response");
  return text.replace(/```json|```/g, "").trim();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function scanDocument(deckId, file) {
  view.scanning = true; view.scanError = ""; render();
  try {
    const base64Data = await fileToBase64(file);
    const mimeType = file.type || "image/jpeg";
    const transcribePrompt = `Transcribe all readable, study-relevant text from this document into clean, well-organized notes. If it's a multi-page document, cover all pages. Use short paragraphs or bullet points, whichever fits the content. Ignore page numbers, watermarks, and headers/footers that aren't actual content. Respond with ONLY the extracted notes as plain text — no commentary, no markdown fences.`;
    const extractedText = await askGeminiVision(transcribePrompt, base64Data, mimeType);
    if (!extractedText || extractedText.length < 5) throw new Error("Couldn't read any text from that image. Try a clearer photo.");
    const note = { id: uid(), deckId, content: extractedText, createdAt: todayISO() };
    state.notes = [note, ...state.notes];
    persist();
    view.scanning = false; render();
    await generateFlashcards(deckId, extractedText);
  } catch (e) {
    view.scanError = e.message === "no-key"
      ? "Add your Gemini API key first (Settings link below) to scan documents."
      : `Scan failed: ${e.message}`;
    view.scanning = false; render();
  }
}

async function generateFlashcards(deckId, noteContent) {
  view.generating = true; view.genError = ""; render();
  try {
    const prompt = `You are helping a student turn study notes into flashcards. Read the notes below and produce 5 to 8 flashcards that test the key facts, definitions, and concepts. Respond with ONLY a JSON array, no preamble, no markdown fences, in this exact shape:
[{"question": "...", "answer": "..."}]
Keep questions specific and answers concise (under 30 words).

NOTES:
"""
${noteContent}
"""`;
    const raw = await askGemini(prompt);
    const parsed = JSON.parse(raw);
    const newCards = parsed.filter(c => c.question && c.answer).map(c => ({
      id: uid(), deckId, question: c.question, answer: c.answer,
      interval: 1, ease: 2.3, repetitions: 0, nextReview: todayISO()
    }));
    state.cards = [...newCards, ...state.cards];
    persist();
    view.tab = "cards";
  } catch (e) {
    view.genError = e.message === "no-key"
      ? "Add your Gemini API key first (Settings link below) to use AI generation."
      : `Gemini said: ${e.message}`;
  } finally {
    view.generating = false; render();
  }
}

function buildImprovePrompt(mode, content) {
  const instruction = mode === "summarize"
    ? "Summarize the notes below into a tight, well-organized summary that keeps every key fact, name, date, and definition, but cuts filler, repetition, and citation clutter. Use short paragraphs or bullet points, whichever fits the content better."
    : "Improve the notes below: fix grammar and clarity, organize them with clear structure (headings or bullet points where useful), and tighten the wording — but do not remove any factual content, and do not add any new facts that aren't in the original.";
  return `${instruction} Respond with ONLY the rewritten notes as plain text — no preamble, no markdown fences, no commentary.

NOTES:
"""
${content}
"""`;
}

async function improveNote(noteId, mode) {
  const note = state.notes.find(n => n.id === noteId);
  if (!note) return;
  view.noteAiLoading = noteId; view.noteAiMode = mode; view.noteAiError = ""; render();
  try {
    const raw = await askGemini(buildImprovePrompt(mode, note.content));
    view.noteAiPreview = { source: "note", noteId, mode, text: raw.trim() };
  } catch (e) {
    view.noteAiError = e.message === "no-key"

}

function addManualCard(deckId, question, answer) {

function startStudy(deckId, useDue) {
  const deckCards = deckId ? state.cards.filter(c => c.deckId === deckId) : state.cards;
  const pool = useDue ? deckCards.filter(c => c.nextReview <= todayISO()) : deckCards;
  if (pool.length === 0) return;
  view.studySession = { queue: [...pool].sort(() => Math.random() - 0.5), index: 0, showAnswer: false };
  view.tab = "study"; render();
}
function startStudyAllDue() {
  const pool = state.cards.filter(c => c.nextReview <= todayISO());
  if (pool.length === 0) return;
  view.studySession = { queue: [...pool].sort(() => Math.random() - 0.5), index: 0, showAnswer: false };
  view.activeDeckId = null;
  view.crossDeckStudy = true;
  view.tab = "study"; render();
}
function rateCard(rating) {
  const session = view.studySession;
  const card = session.queue[session.index];
  state.cards = state.cards.map(c => {
    if (c.id !== card.id) return c;
    let { interval, ease, repetitions } = c;
    if (rating === "again") { repetitions = 0; interval = 1; ease = Math.max(1.3, ease - 0.2); }
    else {
      repetitions += 1;
      if (rating === "hard") { interval = Math.max(1, Math.round(interval * 1.2)); ease = Math.max(1.3, ease - 0.05); }
      else if (rating === "good") { interval = Math.round(interval * ease); }
      else if (rating === "easy") { interval = Math.round(interval * ease * 1.3); ease = ease + 0.1; }
    }
    return { ...c, interval, ease, repetitions, nextReview: addDays(todayISO(), interval) };
  });
  persist();
  const nextIndex = session.index + 1;
  if (nextIndex >= session.queue.length) {
    view.studySession = null;
    if (view.crossDeckStudy) { view.crossDeckStudy = false; view.topTab = "study"; }
    else { view.tab = "cards"; }
  }
  else { view.studySession = { ...session, index: nextIndex, showAnswer: false }; }
  render();
}
function startQuiz(deckId) {
  const deckCards = state.cards.filter(c => c.deckId === deckId);
  if (deckCards.length < 3) return;
  const shuffled = [...deckCards].sort(() => Math.random() - 0.5).slice(0, Math.min(10, deckCards.length));
  const questions = shuffled.map(c => {
    const distractors = deckCards.filter(o => o.id !== c.id).sort(() => Math.random() - 0.5).slice(0, 3).map(o => o.answer);
    const options = [...distractors, c.answer].sort(() => Math.random() - 0.5);
    return { question: c.question, correct: c.answer, options };
  });
  view.quiz = { questions, index: 0, score: 0, picked: null };
  view.tab = "quiz"; render();
}
function pickQuizOption(opt) {
  if (view.quiz.picked) return;
  const correct = opt === view.quiz.questions[view.quiz.index].correct;
  view.quiz.picked = opt;
  view.quiz.score += correct ? 1 : 0;
  render();
}
function nextQuizQuestion() {
  const nextIndex = view.quiz.index + 1;
  if (nextIndex >= view.quiz.questions.length) { view.tab = "quizdone"; }
  else { view.quiz.index = nextIndex; view.quiz.picked = null; }
  render();
}

// ---------- render helpers ----------
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function render() {
  const app = document.getElementById("app");
  const activeDeck = state.decks.find(d => d.id === view.activeDeckId);

  let html = `<div class="header"><div class="brand">Study Desk</div>`;
  html += activeDeck ? `<div class="back" onclick="goHome()">&larr; back</div>` : `<div class="settings-link" onclick="openKeyModal()">API key</div>`;
  html += `</div>`;

  if (!activeDeck && view.crossDeckStudy && view.studySession) {
    html += `<div class="content">` + renderTabContent(null) + `</div>`;
  } else if (!activeDeck) {
    if (view.topTab === "search") html += renderSearchScreen();
    else if (view.topTab === "study") html += renderStudyHub();
    else if (view.topTab === "library") html += renderLibraryScreen();
    else html += renderDeckList(true);
  } else {
    html += renderDeckTabs(activeDeck);
    html += `<div class="content">` + renderTabContent(activeDeck) + `</div>`;
  }

  if (!activeDeck) html += renderBottomNav();

  if (view.showKeyModal) html += renderKeyModal();
  if (view.noteAiPreview) html += renderNoteAiPreviewModal();

  app.innerHTML = html;
  wireEvents(activeDeck);
}

const PRACTICE_TEST_HINT = /practice tests?|test prep|exam prep|study guide/;

function detectExternalSearch(rawQuery) {
  const q = rawQuery.toLowerCase();
  for (const site of EXTERNAL_TEST_SITES) {
    if (site.match.test(q)) return { label: site.label, sub: site.sub, url: site.url };
  }
  if (PRACTICE_TEST_HINT.test(q)) {
    return {
      label: `Search the web for "${rawQuery.trim()}"`,
      sub: "Opens results in a new tab",
      url: "https://www.google.com/search?q=" + encodeURIComponent(rawQuery.trim())
    };
  }
  return null;
}

// Builds ONLY the results markup below the search input, so it can be
// swapped in on every keystroke without touching (and unfocusing) the input itself.
function buildSearchResultsHtml(rawQuery) {
  const q = rawQuery.trim().toLowerCase();
  if (!q) {
    return `<div class="empty">Search across your notes and flashcards — or search "SAT practice test", "ACT practice", or "biology practice test" to jump to prep sites.</div>`;
  }
  let html = "";
  const external = detectExternalSearch(rawQuery);
  if (external) {
    html += `<div class="search-result search-result-external" data-external-link="${esc(external.url)}">
      <div class="search-result-deck">🌐 External</div>
      <div class="search-result-external-title">${esc(external.label)} ↗</div>
      <div class="search-result-external-sub">${esc(external.sub)}</div>
    </div>`;
  }
  const deckById = id => state.decks.find(d => d.id === id);
  const matchedNotes = state.notes.filter(n => n.content.toLowerCase().includes(q));
  const matchedCards = state.cards.filter(c => c.question.toLowerCase().includes(q) || c.answer.toLowerCase().includes(q));
  if (!external && matchedNotes.length === 0 && matchedCards.length === 0) {
    html += `<div class="empty">No matches for "${esc(rawQuery)}".</div>`;
  }
  matchedNotes.forEach(n => {
    const deck = deckById(n.deckId);
    if (!deck) return;
    html += `<div class="search-result" data-open="${deck.id}">
      <div class="search-result-deck">${esc(deck.title)} · Note</div>
      <div style="font-size:13px; margin-top:4px; line-height:1.4;">${esc(n.content.slice(0, 140))}${n.content.length > 140 ? "…" : ""}</div>
    </div>`;
  });
  matchedCards.forEach(c => {
    const deck = deckById(c.deckId);
    if (!deck) return;
    html += `<div class="search-result" data-open="${deck.id}">
      <div class="search-result-deck">${esc(deck.title)} · Flashcard</div>
      <div style="font-weight:700; font-size:14px; margin-top:4px;">${esc(c.question)}</div>
      <div class="small" style="margin-top:2px;">${esc(c.answer)}</div>
    </div>`;
  });
  return html;
}

function renderSearchScreen() {
  return `<div class="content">
    <div class="search-bar"><span>🔍</span><input id="searchInput" placeholder="Search for anything, or try &quot;SAT practice test&quot;" value="${esc(view.searchQuery || "")}" /></div>
    <div id="searchResultsBody">${buildSearchResultsHtml(view.searchQuery || "")}</div>
  </div>`;
}

// Wires clicks for search-result cards without a full render() — used both on
// initial render (via wireEvents) and after a partial results-only update.
function wireSearchResultEvents() {
  document.querySelectorAll("#searchResultsBody [data-open]").forEach(el => el.addEventListener("click", () => {
    view.activeDeckId = el.getAttribute("data-open"); view.tab = "notes"; render();
  }));
  document.querySelectorAll("#searchResultsBody [data-external-link]").forEach(el => el.addEventListener("click", () => {
    window.open(el.getAttribute("data-external-link"), "_blank", "noopener");
  }));
}

function renderStudyHub() {
  const totalDue = state.cards.filter(c => c.nextReview <= todayISO()).length;
  let html = `<div class="content">
    <div class="section-label">Study</div>
    <button class="btn-primary" id="studyAllDueBtn" style="width:100%; margin-bottom:20px; padding:16px;" ${totalDue === 0 ? "disabled" : ""}>
      🎯 Study all due cards (${totalDue})
    </button>`;
  if (state.decks.length === 0) {
    html += `<div class="empty">Create a deck and add some flashcards first.</div>`;
  } else {
    html += `<div class="section-label">By deck</div>`;
    state.decks.forEach((d, i) => {
      const dCards = state.cards.filter(c => c.deckId === d.id);
      const dDue = dCards.filter(c => c.nextReview <= todayISO()).length;
      const col = folderColor(i);
      html += `<div class="deck-row" data-open="${d.id}">
        <div class="folder-icon" style="background:${col.bg}; color:${col.fg};">📁</div>
        <div style="flex:1;">
          <div class="deck-title">${esc(d.title)}</div>
          <div class="deck-meta">${dCards.length} cards${dDue > 0 ? ` · ${dDue} due` : " · none due"}</div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function renderDeckTabs(deck) {
  const deckCards = state.cards.filter(c => c.deckId === deck.id);
  const tabs = [["notes", "Notes"], ["cards", `Flashcards (${deckCards.length})`], ["quiz", "Quiz"]];
  let html = `<div class="tabs">`;
  tabs.forEach(([key, label]) => {
    const active = view.tab === key || (key === "cards" && view.tab === "study") || (key === "quiz" && view.tab === "quizdone");
    html += `<div class="tab ${active ? "active" : ""}" data-tab="${key}">${label}</div>`;
  });
  html += `</div>`;
  return html;
}

function renderTabContent(deck) {
  const deckNotes = deck ? state.notes.filter(n => n.deckId === deck.id) : [];
  const deckCards = deck ? state.cards.filter(c => c.deckId === deck.id) : [];
  const dueCards = deckCards.filter(c => c.nextReview <= todayISO());

  if (view.tab === "notes") {
    const draftLoading = view.noteAiLoading === "__draft__";
    let html = `<textarea id="noteDraft" placeholder="Paste or type your notes here…" oninput="onDraftInput(this.value)">${esc(view.draftText || "")}</textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn-secondary" id="saveNoteBtn">Save note</button>
        <button class="btn-gold" id="genFromDraftBtn" ${view.generating ? "disabled" : ""}>
          ${view.generating ? '<span class="spinner"></span> ' : ""}Generate flashcards from this
        </button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn-secondary" id="summarizeDraftBtn" style="color:var(--green);" ${draftLoading ? "disabled" : ""}>
          ${draftLoading && view.noteAiMode === "summarize" ? '<span class="spinner" style="border-top-color:var(--green);"></span> ' : ""}Summarize
        </button>
        <button class="btn-secondary" id="improveDraftBtn" style="color:var(--amber);" ${draftLoading ? "disabled" : ""}>
          ${draftLoading && view.noteAiMode === "improve" ? '<span class="spinner" style="border-top-color:var(--amber);"></span> ' : ""}Improve
        </button>
      </div>
      <div class="row" style="margin-top:8px;">
        <label class="btn-secondary" for="scanDocInput" style="cursor:pointer; ${view.scanning ? 'opacity:0.6; pointer-events:none;' : ''}">
          ${view.scanning ? '<span class="spinner"></span> Scanning…' : '📷 Scan photo'}
        </label>
        <input type="file" id="scanDocInput" accept="image/*" capture="environment" style="display:none;" ${view.scanning ? "disabled" : ""} />
        <label class="btn-secondary" for="scanFileInput" style="cursor:pointer; ${view.scanning ? 'opacity:0.6; pointer-events:none;' : ''}">
          ${view.scanning ? '<span class="spinner"></span> Scanning…' : '📄 Upload PDF or image'}
        </label>
        <input type="file" id="scanFileInput" accept="application/pdf,image/*" style="display:none;" ${view.scanning ? "disabled" : ""} />
      </div>`;
    if (view.scanError) html += `<div class="small" style="color:var(--red); margin-top:8px;">${esc(view.scanError)}</div>`;
    if (view.genError) html += `<div class="small" style="color:var(--red); margin-top:8px;">${esc(view.genError)}</div>`;
    if (view.noteAiError) html += `<div class="small" style="color:var(--red); margin-top:8px;">${esc(view.noteAiError)}</div>`;
    html += `<div style="margin-top:22px;">`;
    if (deckNotes.length === 0) html += `<div class="empty">No notes yet.</div>`;
    deckNotes.forEach(n => {
      const isLoading = view.noteAiLoading === n.id;
      html += `<div class="note-card">
        <div style="white-space:pre-wrap; line-height:1.5; font-size:14px;">${esc(n.content)}</div>
        <div class="row" style="justify-content:space-between; margin-top:12px; align-items:center;">
          <div class="row" style="gap:14px;">
            <span class="btn-link" data-gen-note="${n.id}" style="${isLoading ? 'opacity:0.5; pointer-events:none;' : ''}">Flashcards &rarr;</span>
            <span class="btn-link" data-summarize-note="${n.id}" style="color:var(--green); ${isLoading ? 'opacity:0.5; pointer-events:none;' : ''}">${isLoading && view.noteAiMode === 'summarize' ? '<span class="spinner" style="border-top-color:var(--green);"></span> ' : ''}Summarize</span>
            <span class="btn-link" data-improve-note="${n.id}" style="color:var(--amber); ${isLoading ? 'opacity:0.5; pointer-events:none;' : ''}">${isLoading && view.noteAiMode === 'improve' ? '<span class="spinner" style="border-top-color:var(--amber);"></span> ' : ''}Improve</span>
          </div>
          <button class="btn-ghost" data-delete-note="${n.id}">Delete</button>
        </div>
      </div>`;
    });
    html += `</div>`;
    return html;
  }

  if (view.tab === "cards") {
    let html = `<div class="row" style="margin-bottom:14px;">
      <button class="btn-primary" id="studyDueBtn" ${dueCards.length === 0 ? "disabled" : ""}>Study due cards (${dueCards.length})</button>
      <button class="btn-secondary" id="studyAllBtn" ${deckCards.length === 0 ? "disabled" : ""}>Study all (${deckCards.length})</button>
    </div>
    <div class="row" style="margin-bottom:18px;">
      <input id="cardQ" placeholder="Question" style="flex:1 1 160px" />
      <input id="cardA" placeholder="Answer" style="flex:1 1 160px" />
      <button class="btn-secondary" id="addCardBtn">Add card</button>
    </div>`;
    if (deckCards.length === 0) {
      html += `<div class="empty">No flashcards yet — generate some from your notes, or add one manually above.</div>`;
    } else {
      deckCards.forEach(c => {
        html += `<div class="card-row" style="display:flex; justify-content:space-between; gap:10px;">
          <div>
            <div style="font-weight:600; font-size:14px;">${esc(c.question)}</div>
            <div class="small" style="margin-top:4px;">${esc(c.answer)}</div>
            <div class="small" style="margin-top:6px;">${c.nextReview <= todayISO() ? "Due now" : `Next review ${c.nextReview}`}</div>
          </div>
          <button class="btn-ghost" data-delete-card="${c.id}" style="height:fit-content;">Delete</button>
        </div>`;
      });
    }
    return html;
  }

  if (view.tab === "study" && view.studySession) {
    const session = view.studySession;
    const card = session.queue[session.index];
    let html = `<div class="center"><div class="small" style="margin-bottom:14px;">Card ${session.index + 1} of ${session.queue.length}</div>`;
    html += `<div class="flash-card" id="flashCard">${esc(session.showAnswer ? card.answer : card.question)}</div>`;
    if (!session.showAnswer) {
      html += `<div class="small">Tap the card to reveal the answer</div>`;
    } else {
      html += `<div class="row" style="justify-content:center;">
        <button style="background:var(--red); color:#fff;" data-rate="again">Again</button>
        <button style="background:var(--amber); color:#fff;" data-rate="hard">Hard</button>
        <button class="btn-primary" data-rate="good">Good</button>
        <button style="background:var(--green); color:#fff;" data-rate="easy">Easy</button>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  if (view.tab === "quiz" && !view.quiz) {
    if (deckCards.length < 3) return `<div class="center"><div class="empty">Add at least 3 flashcards to this deck to unlock a quiz.</div></div>`;
    return `<div class="center"><button class="btn-primary" id="startQuizBtn">Start quiz (${Math.min(10, deckCards.length)} questions)</button></div>`;
  }

  if (view.tab === "quiz" && view.quiz) {
    const q = view.quiz.questions[view.quiz.index];
    let html = `<div class="small" style="margin-bottom:10px;">Question ${view.quiz.index + 1} of ${view.quiz.questions.length} · Score ${view.quiz.score}</div>
      <div style="font-size:16px; font-weight:600; margin-bottom:16px;">${esc(q.question)}</div>`;
    q.options.forEach(opt => {
      let style = "";
      if (view.quiz.picked) {
        if (opt === q.correct) style = "background:rgba(34,197,94,0.18); border-color:var(--green);";
        else if (opt === view.quiz.picked) style = "background:rgba(255,92,122,0.18); border-color:var(--red);";
      }
      html += `<div class="quiz-option" style="${style}" data-pick="${esc(opt)}">${esc(opt)}</div>`;
    });
    if (view.quiz.picked) {
      html += `<button class="btn-primary" id="nextQuizBtn" style="margin-top:10px;">${view.quiz.index + 1 >= view.quiz.questions.length ? "See results" : "Next question"}</button>`;
    }
    return html;
  }

  if (view.tab === "quizdone" && view.quiz) {
    const pct = view.quiz.score / view.quiz.questions.length;
    const msg = pct === 1 ? "Perfect score." : pct >= 0.7 ? "Solid work." : "Worth another pass through the notes.";
    return `<div class="center">
      <div style="font-family:'Poppins',sans-serif; font-weight:800; font-size:30px; color:var(--purple-dark); margin-bottom:6px;">${view.quiz.score} / ${view.quiz.questions.length}</div>
      <div class="small" style="margin-bottom:18px;">${msg}</div>
      <div class="row" style="justify-content:center;">
        <button class="btn-primary" id="retakeQuizBtn">Retake quiz</button>
        <button class="btn-secondary" id="backToCardsBtn">Back to cards</button>
      </div>
    </div>`;
  }

  return "";
}

function renderKeyModal() {
  return `<div class="modal-backdrop" id="keyModalBackdrop">
    <div class="modal">
      <div style="font-weight:700; margin-bottom:8px;">Gemini API key</div>
      <div class="small" style="margin-bottom:12px;">Needed only for "Generate flashcards" AI features. Get a free key at aistudio.google.com/apikey. Stored only on this device.</div>
      <input id="apiKeyInput" placeholder="AIza…" value="${esc(getApiKey())}" style="margin-bottom:12px;" />
      <div class="row" style="justify-content:flex-end;">
        <button class="btn-secondary" id="closeKeyModal">Cancel</button>
        <button class="btn-primary" id="saveKeyModal">Save</button>
      </div>
    </div>
  </div>`;
}

function renderNoteAiPreviewModal() {
  const { mode, text } = view.noteAiPreview;
  const label = mode === "summarize" ? "Summary" : "Improved version";
  return `<div class="modal-backdrop" id="noteAiModalBackdrop">
    <div class="modal" style="max-width:460px;">
      <div style="font-weight:700; margin-bottom:4px; font-family:'Poppins',sans-serif;">${label}</div>
      <div class="small" style="margin-bottom:4px;">Review before replacing your note.</div>
      <div class="ai-note-preview">${esc(text)}</div>
      <div class="row" style="justify-content:flex-end;">
        <button class="btn-secondary" id="dismissNoteAi">Discard</button>
        <button class="btn-primary" id="acceptNoteAi">Use this</button>
      </div>
    </div>
  </div>`;
}

function goHome() { view.activeDeckId = null; render(); }
function openKeyModal() { view.showKeyModal = true; render(); }

// ---------- event wiring ----------
function wireEvents(activeDeck) {
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  $$("[data-nav]").forEach(el => el.addEventListener("click", () => {
    view.topTab = el.getAttribute("data-nav");
    render();
  }));
  $$(".quick-card[data-nav]").forEach(el => el.addEventListener("click", () => {
    view.topTab = el.getAttribute("data-nav");
    render();
  }));
  $("#quickCreate")?.addEventListener("click", () => {
    setTimeout(() => $("#deckTitle")?.focus(), 0);
  });
  $("#navAddBtn")?.addEventListener("click", () => {
    view.activeDeckId = null;
    view.topTab = "home";
    render();
    setTimeout(() => $("#deckTitle")?.focus(), 0);
  });
  $("#searchInput")?.addEventListener("input", (e) => {
    view.searchQuery = e.target.value;
    // Only swap the results below the input — never re-render the input itself,
    // or it loses focus and the on-screen keyboard flickers closed/open on every keystroke.
    const body = $("#searchResultsBody");
    if (body) {
      body.innerHTML = buildSearchResultsHtml(view.searchQuery);
      wireSearchResultEvents();
    }
  });
  $("#studyAllDueBtn")?.addEventListener("click", startStudyAllDue);
  $$("[data-external-link]").forEach(el => el.addEventListener("click", () => {
    window.open(el.getAttribute("data-external-link"), "_blank", "noopener");
  }));

  if (!activeDeck && !(view.crossDeckStudy && view.studySession)) {
    $("#createDeckBtn")?.addEventListener("click", () => {
      createDeck($("#deckTitle").value, $("#deckSubject").value);
    });
    $("#createSubjectBtn")?.addEventListener("click", () => {
      createSubject($("#subjectName").value);
    });
    $("#createDeckInSubjectBtn")?.addEventListener("click", () => {
      const subjId = view.activeSubjectId === "__unfiled__" ? null : view.activeSubjectId;
      createDeck($("#deckTitle").value, "", subjId);
    });
    $$("[data-open-subject]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete-subject]")) return;
      view.activeSubjectId = el.getAttribute("data-open-subject"); render();
    }));
    $$("[data-delete-subject]").forEach(el => el.addEventListener("click", (e) => {
      e.stopPropagation(); deleteSubject(el.getAttribute("data-delete-subject"));
    }));
    $("[data-back-to-subjects]")?.addEventListener("click", () => { view.activeSubjectId = undefined; render(); });
    $$("[data-open]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete]")) return;
      view.activeDeckId = el.getAttribute("data-open"); view.tab = "notes"; render();
    }));
    $$("[data-delete]").forEach(el => el.addEventListener("click", (e) => {
      e.stopPropagation(); deleteDeck(el.getAttribute("data-delete"));
    }));
  }
  if (activeDeck) {
    $$("[data-tab]").forEach(el => el.addEventListener("click", () => { view.tab = el.getAttribute("data-tab"); render(); }));

    $("#saveNoteBtn")?.addEventListener("click", () => saveNote(activeDeck.id, $("#noteDraft").value));
    $("#genFromDraftBtn")?.addEventListener("click", () => generateFlashcards(activeDeck.id, $("#noteDraft").value));
    $("#summarizeDraftBtn")?.addEventListener("click", () => improveDraft("summarize"));
    $("#improveDraftBtn")?.addEventListener("click", () => improveDraft("improve"));
    $("#scanDocInput")?.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) scanDocument(activeDeck.id, file);
      e.target.value = "";
    });
    $("#scanFileInput")?.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) scanDocument(activeDeck.id, file);
      e.target.value = "";
    });
    $$("[data-gen-note]").forEach(el => el.addEventListener("click", () => {
      const note = state.notes.find(n => n.id === el.getAttribute("data-gen-note"));
      if (note) generateFlashcards(activeDeck.id, note.content);
    }));
    $$("[data-delete-note]").forEach(el => el.addEventListener("click", () => deleteNote(el.getAttribute("data-delete-note"))));
    $$("[data-summarize-note]").forEach(el => el.addEventListener("click", () => improveNote(el.getAttribute("data-summarize-note"), "summarize")));
    $$("[data-improve-note]").forEach(el => el.addEventListener("click", () => improveNote(el.getAttribute("data-improve-note"), "improve")));

    $("#studyDueBtn")?.addEventListener("click", () => startStudy(activeDeck.id, true));
    $("#studyAllBtn")?.addEventListener("click", () => startStudy(activeDeck.id, false));
    $("#addCardBtn")?.addEventListener("click", () => addManualCard(activeDeck.id, $("#cardQ").value, $("#cardA").value));
    $$("[data-delete-card]").forEach(el => el.addEventListener("click", () => deleteCard(el.getAttribute("data-delete-card"))));

    $("#flashCard")?.addEventListener("click", () => {
      if (!view.studySession.showAnswer) { view.studySession.showAnswer = true; render(); }
    });
    $$("[data-rate]").forEach(el => el.addEventListener("click", () => rateCard(el.getAttribute("data-rate"))));

    $("#startQuizBtn")?.addEventListener("click", () => startQuiz(activeDeck.id));
    $$("[data-pick]").forEach(el => el.addEventListener("click", () => pickQuizOption(el.getAttribute("data-pick"))));
    $("#nextQuizBtn")?.addEventListener("click", nextQuizQuestion);
    $("#retakeQuizBtn")?.addEventListener("click", () => { view.quiz = null; startQuiz(activeDeck.id); });
    $("#backToCardsBtn")?.addEventListener("click", () => { view.quiz = null; view.tab = "cards"; render(); });
  }

  $(".settings-link")?.addEventListener("click", openKeyModal);
  $("#closeKeyModal")?.addEventListener("click", () => { view.showKeyModal = false; render(); });
  $("#saveKeyModal")?.addEventListener("click", () => {
    setApiKey($("#apiKeyInput").value.trim());
    view.showKeyModal = false; render();
  });
  $("#keyModalBackdrop")?.addEventListener("click", (e) => {
    if (e.target.id === "keyModalBackdrop") { view.showKeyModal = false; render(); }
  });

  $("#acceptNoteAi")?.addEventListener("click", acceptNoteAiPreview);
  $("#dismissNoteAi")?.addEventListener("click", dismissNoteAiPreview);
  $("#noteAiModalBackdrop")?.addEventListener("click", (e) => {
    if (e.target.id === "noteAiModalBackdrop") dismissNoteAiPreview();
  });
}

render();

// register a minimal service worker for installability, if supported
if ("serviceWorker" in navigator) {
  const swCode = `self.addEventListener('fetch', () => {});`;
  const swUrl = URL.createObjectURL(new Blob([swCode], { type: "application/javascript" }));
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
</body>
